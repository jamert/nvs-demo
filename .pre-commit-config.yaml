repos:
  - repo: local
    hooks:
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: isort
        name: isort
        entry: uv run --locked isort --check-only --diff .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        pass_filenames: false
        always_run: true
