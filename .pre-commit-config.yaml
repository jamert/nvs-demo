default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: isort
        name: isort
        entry: uv run --locked isort --check-only --diff .
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-check
        name: ruff check
        entry: uv run --locked ruff check
        language: system
        pass_filenames: false
        always_run: true
      - id: ruff-format
        name: ruff format
        entry: uv run --locked ruff format --check
        language: system
        pass_filenames: false
        always_run: true
      - id: pytest
        name: pytest
        entry: uv run --locked pytest
        language: system
        pass_filenames: false
        always_run: true
      - id: search-eval-trailer
        name: Record search eval score
        entry: uv run --locked python -m evals.commit_message
        language: system
        stages: [commit-msg]
        always_run: true
