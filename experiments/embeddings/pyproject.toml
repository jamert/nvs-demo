[project]
name = "nevis-embedding-encoder"
version = "0.1.0"
requires-python = "==3.12.14"
dependencies = [
    "numpy==2.2.6",
    "onnxruntime==1.22.0",
    "tokenizers==0.21.1",
]

[project.scripts]
nevis-embedding-encoder = "nevis_embedding_encoder:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"
