[project]
name = "nevis-tiny-search"
version = "0.1.0"
description = "A small search API for clients and their documents."
readme = "README.md"
requires-python = ">=3.15"
dependencies = [
    "fastapi>=0.165.0",
    "pydantic[email]>=2.14.4",
    "uvicorn>=0.54.0",
]

[project.scripts]
nevis-tiny-search = "nevis_search.cli:main"

[dependency-groups]
dev = [
    "httpx",
    "isort>=9.0.2",
    "pre-commit>=4.7.0",
    "pyright>=1.1.414",
    "pytest",
    "pytest-cov>=7",
    "pyyaml>=6.0.4",
    "ruff>=0.17.6",
]

[build-system]
requires = ["uv_build>=0.13.7,<0.14"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "nevis_search"

[tool.isort]
profile = "black"
line_length = 88
skip_gitignore = true

[tool.ruff]
line-length = 88

[tool.pyright]
typeCheckingMode = "basic"
reportDeprecated = "warning"
include = ["src", "tests", "evals"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["src/nevis_search"]
patch = ["subprocess"]
sigterm = true  # The test harness stops the server with SIGTERM.
# The pytest process itself may not run any application code.
disable_warnings = ["no-data-collected"]
